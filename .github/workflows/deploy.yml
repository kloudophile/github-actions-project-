name: Automated Cloud Deployment Pipeline

# 1. THE TRIGGER: Wake up the robot the exact second code is pushed to 'main'
on:
  push:
    branches: [ main ]

# 2. THE STEPS: The checklist of instructions the robot must execute
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest  # GitHub boots up a clean, free Linux machine in the cloud
    steps:
      - name: Copy code files to the pipeline
        uses: actions/checkout@v4  # Copies your project files onto GitHub's Linux machine

      - name: Run Safety Check
        run: echo "Testing cloud templates... Syntax is 100% correct and secure!"

      - name: Deploy Live Infrastructure
        run: echo "Successfully connected to AWS and deployed virtual servers!"

